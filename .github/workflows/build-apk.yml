name: Build Mirror APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Build Android APK
        run: cd android && ./gradlew assembleRelease

      - name: Sign and verify APK
        env:
          MIRROR_KEYSTORE_BASE64: ${{ secrets.MIRROR_KEYSTORE_BASE64 }}
          MIRROR_KEYSTORE_PASSWORD: ${{ secrets.MIRROR_KEYSTORE_PASSWORD }}
          MIRROR_KEY_ALIAS: ${{ secrets.MIRROR_KEY_ALIAS }}
        run: |
          APK_DIR=android/app/build/outputs/apk/release
          UNSIGNED_APK="$APK_DIR/app-release-unsigned.apk"
          ALIGNED_APK="$APK_DIR/app-release-aligned.apk"
          SIGNED_APK="$APK_DIR/mirror-life-os.apk"
          KEYSTORE="$RUNNER_TEMP/mirror-life-os.keystore"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          printf '%s' "$MIRROR_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$MIRROR_KEY_ALIAS" \
            --ks-pass pass:"$MIRROR_KEYSTORE_PASSWORD" --key-pass pass:"$MIRROR_KEYSTORE_PASSWORD" \
            --out "$SIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirror-life-os-apk
          path: android/app/build/outputs/apk/release/mirror-life-os.apk
          retention-days: 30

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/mirror-life-os.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
